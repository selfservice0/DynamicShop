# plugin.yml
name: DynamicShop
version: '@project.version@'
main: org.minecraftsmp.dynamicshop.DynamicShop
api-version: '1.20'
author: selfservice0
description: A dynamic economy shop with player-interactive GUI
website: https://minecraftsmp.org

depend: [Vault, ProtocolLib]
softdepend: [PlaceholderAPI, ItemsAdder, Nexo, Oraxen, CoinsEngine, floodgate, ValhallaMMO]

commands:
  shop:
    description: Open the dynamic shop GUI
    usage: /shop [<category>|sell [gui|<price>]|sellhand|sellall [hand]]
    aliases: [ dshop, market ]
    permission: dynamicshop.use
  sell:
    description: Open a deposit menu to sell items to the server shop
    usage: /sell [gui]
    permission: dynamicshop.use.sellgui
  shopadmin:
    description: Admin commands for managing the shop
    usage: /shopadmin <theme [list|name|install [force]]|reload|setstock|setrate|changerate|resetshortage|setinflation|webadmin|webupdate [check]>
    aliases: [dsa, shopadm]
    permission: dynamicshop.admin

permissions:
  dynamicshop.use:
    description: Allows using the shop
    default: true
  dynamicshop.admin:
    description: Allows managing the shop
    default: op
  dynamicshop.bypass.stock:
    description: Allows buying items even when out of stock (if restricted)
    default: op
  dynamicshop.bypass.cooldown:
    description: Allows bypassing the transaction cooldown
    default: op
  dynamicshop.playershop.sell:
    description: Allows listing items in player shops
    default: true
  dynamicshop.use.sellhand:
    description: Allows selling held items via /shop sellhand
    default: false
  dynamicshop.use.sellall:
    description: Allows /shop sellall and /shop sellall hand
    default: op
  dynamicshop.use.sellgui:
    description: Allows the /sell and /shop sell deposit menu
    default: true
